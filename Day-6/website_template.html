<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .nav {
            height: 100px;
            width: 100%;
            background-color: rgb(241, 201, 127);
        }

        .body {
            background-color: beige;
            flex: 1;
        }

        .footer {
            height: 100px;
            width: 100%;
            background-color: aqua;
        }
    </style>
</head>

<body>

    <div class="nav"></div>

    <div class="body"></div>

    <div class="footer"></div>

</body>
</html>
